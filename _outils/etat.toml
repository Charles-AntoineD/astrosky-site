# Interrupteurs du site astrosky.gg.
#
# Règle : une phrase ne s'affiche que le jour où elle est vraie. Mettre une valeur à `true` seulement quand c'est
# vrai en jeu ou en ligne ce jour-là. Après chaque changement :
#
#     py _outils/construire.py
#
# puis valider et pousser (voir _outils/LISEZMOI.md). Les pages légales (règles, confidentialité, conditions de la
# boutique) n'ont pas d'interrupteur : le site les relie dès que leur fichier .md est dans le dépôt.

[serveur]
adresse = "astrosky.gg"
# Versions de Minecraft: Java Edition acceptées, relevées au premier ping du serveur public.
# Écrire "26.2–26.3" seulement si un client 26.3 a pu se connecter le jour même.
versions = "26.2"
# true seulement quand le serveur est ouvert à tous.
ouvert = false
# Date d'ouverture annoncée, telle qu'elle s'affiche (accueil, page « Rejoindre »). Vide : « date à annoncer ». À remplir
# le jour de l'annonce (jamais avant : aucune date à l'écran avant l'essai fermé) ; les deux ou aucune. Exemple :
#   ouverture_en = "Friday, November 6, 2026, at 6 p.m. Eastern Time (Québec time)"
#   ouverture_fr = "le vendredi 6 novembre 2026, à 18 h, heure du Québec"
ouverture_en = ""
ouverture_fr = ""
# Nombre de joueurs par île à afficher. 0 = ne donner aucun nombre (taille fixée à la bascule du 2026-11-06).
taille_equipe = 0

# Chaque fonction du jeu n'est décrite que si elle existe sur le serveur public ce jour-là.
[jeu]
hotel_des_ventes = true      # hôtel des ventes validé à l'essai (noyau, FR-027)
coffres_boutiques = true     # coffres-boutiques des joueurs
banque_ile = true            # compte commun de l'île
defis = true                 # défis importés
classement_iles = true       # classement du niveau d'île
metiers = true               # métiers en jeu (sur le serveur public ; Owner, 2026-11-09)
equipes_agrandies = false    # équipes d'île agrandies en jeu (Mise à jour 1)
commande_report = false      # /report livré sous ce nom (P-022)

[boutique]
# true seulement quand la boutique Tebex est ouverte, avec ses prix visibles sans compte. Sans les conditions de la
# boutique et la politique de confidentialité (EN et FR) dans le dépôt, le site la garde affichée fermée.
ouverte = false
adresse = "https://astrosky.tebex.store"

[discord]
# Lien d'invitation public (https://discord.gg/...), seulement quand les conditions D1 sont remplies (décision de
# l'Owner du 2026-10-31 : ouvrir le Discord au public). Vide : /discord reste « pas encore ouvert ». Rempli : /discord
# et /fr/discord deviennent la page d'arrivée (âge, règles, contact), avec ce lien sur le bouton, et l'accueil, la FAQ
# et les liens officiels y renvoient.
#
# >>>>>>>>>>  ICI : coller l'invitation PERMANENTE du Discord (pas une invitation qui expire)  <<<<<<<<<<
# ou, plus sûr, lancer  py _outils/construire.py --invitation https://discord.gg/<code>
# (la commande refuse tout ce qui n'est pas une adresse d'invitation, et n'écrit rien en cas d'erreur).
invitation = "https://discord.gg/v59zjh6hJr"

# Nom du salon des suggestions, tel qu'il s'écrit dans Discord, émoji compris (par exemple #💡suggestions-idées). Vide :
# la page des idées (/ideas, /fr/idees, vers laquelle le jeu renvoie depuis le menu pause) n'est pas construite.
# Rempli, et le Discord ouvert : elle l'est. Lancer  py _outils/construire.py --salon-idees #<salon>  (refuse tout ce
# qui n'est pas un nom de salon, et n'écrit rien en cas d'erreur).
salon_idees = "#💡suggestions-idées"

[explorateur]
# Code Explorer affiché sur l'accueil, EN et FR (spec 051, Q6 : « Code sur l'accueil »). Le défi « Mission Control » du
# jeu dit d'ouvrir /website, de trouver le code sur la page d'accueil d'astrosky.gg, puis de taper /website <code>. Même
# valeur que "website_code" dans progression.json du dépôt du studio. Vide : aucune ligne. À remplir seulement quand la
# mise à jour 051 est en ligne sur le serveur public (la ligne dit de taper /website).
code = "LIFTOFF"

[vote]
# true quand l'écouteur de votes est actif sur le serveur public, le test V3 passé sur le serveur public (aucune
# adresse IP enregistrée), la ligne « vote » de la politique de confidentialité publiée, et chaque fiche ci-dessous en
# ligne avec son adresse de vote. Sans la politique de confidentialité (EN et FR) dans le dépôt, la page ne se
# construit pas.
ouvert = false

[[vote.sites]]
nom = "minecraft-mp.com"
adresse = ""

[[vote.sites]]
nom = "minecraftservers.org"
adresse = ""

[[vote.sites]]
nom = "minecraft.buzz"
adresse = ""

# Comptes officiels (déjà en ligne).
[[comptes]]
reseau = "TikTok"
nom = "@astrosky.gg"
adresse = "https://www.tiktok.com/@astrosky.gg"

[[comptes]]
reseau = "YouTube"
nom = "@astroskygg"
adresse = "https://www.youtube.com/@astroskygg"

[[comptes]]
reseau = "Instagram"
nom = "astrosky.gg"
adresse = "https://www.instagram.com/astrosky.gg"

[[comptes]]
reseau = "X"
nom = "@astroskygg"
adresse = "https://x.com/astroskygg"

# Nouvelles datées, la plus récente en premier ; l'accueil montre les trois premières. Aucune pour l'instant : un bloc
# [[nouvelles]] (date, en, fr) en ajoute une. Pas de date d'ouverture ici tant qu'elle n'est pas annoncée.
